name: Manage failure issue
description: Open, refresh or close the integration testing failure issue in the tested scverse repository.

inputs:
  package:
    description: Name of the tested repository in the scverse organization.
    required: true
  python:
    description: Python version the tests ran with.
    required: true
  is-pre:
    description: Whether prerelease dependencies were installed.
    default: "false"
  status:
    description: Status of the calling job, i.e. `job.status`.
    required: true
  failure-type:
    description: Stage that failed, either `install` or `test`.
    default: ""
  app-id:
    description: ID of the GitHub App that manages the issues.
    required: true
  private-key:
    description: Private key of the GitHub App that manages the issues.
    required: true

runs:
  using: composite
  steps:
    - name: Generate tokens
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: scverse

    - name: Check for open failure issue
      if: inputs.status == 'failure'
      id: find_issue
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        failure_type: ${{ inputs.failure-type }}
      run: |
        ISSUE_TITLE="Integration Testing CI ${failure_type^} Failure on python ${{ inputs.python }}${{ inputs.is-pre == 'true' && ' with prerelease dependencies' || '' }}"
        echo "issue_title=$ISSUE_TITLE" >> $GITHUB_ENV
        echo "Checking for existing issue: $ISSUE_TITLE"
        ISSUE=$(gh issue list --repo scverse/${{ inputs.package }} --state open --search "${ISSUE_TITLE}" --json number,createdAt,title | jq --arg title "$ISSUE_TITLE" '[.[] | select(.title == $title)] | .[0] // empty')
        if [[ -n "$ISSUE" ]]; then
          ISSUE_NUMBER=$(echo "$ISSUE" | jq -r '.number')
          CREATED_AT=$(echo "$ISSUE" | jq -r '.createdAt')
          CREATED_EPOCH=$(date -d "$CREATED_AT" +%s)
          NOW_EPOCH=$(date +%s)
          AGE_DAYS=$(( (NOW_EPOCH - CREATED_EPOCH) / 86400 ))
          echo "Found issue #$ISSUE_NUMBER, age: $AGE_DAYS days."
          echo "issue_exists=true" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "issue_age_days=$AGE_DAYS" >> $GITHUB_OUTPUT
        else
          echo "No open failure issue found."
          echo "issue_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Close stale failure issue
      if: inputs.status == 'failure' && steps.find_issue.outputs.issue_exists == 'true' && inputs.is-pre != 'true' && github.event_name == 'schedule'
      id: close_stale
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        if [[ "${{ steps.find_issue.outputs.issue_age_days }}" -gt 7 ]]; then
          echo "Issue #${{ steps.find_issue.outputs.issue_number }} is ${{ steps.find_issue.outputs.issue_age_days }} days old, closing it to open a fresh one."
          # https://github.com/cli/cli/issues/8374 got graphql error about comment, could be a bug.
          # TODO: Add a comment for the closed issue.
          gh issue close "${{ steps.find_issue.outputs.issue_number }}" --repo scverse/${{ inputs.package }} --comment "Closing stale issue after ${{ steps.find_issue.outputs.issue_age_days }} days. A fresh issue will be opened."
          echo "issue_closed=true" >> $GITHUB_OUTPUT
        else
          echo "Issue #${{ steps.find_issue.outputs.issue_number }} is less than a week old, leaving it open."
          echo "issue_closed=false" >> $GITHUB_OUTPUT
        fi

    - name: Report failure issue
      if: inputs.status == 'failure' && (steps.find_issue.outputs.issue_exists == 'false' || steps.close_stale.outputs.issue_closed == 'true') && github.event_name == 'schedule'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        failure_type: ${{ inputs.failure-type }}
      run: |
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        ISSUE_BODY="The daily CI failed on ${failure_type} for ${{ inputs.package }} failed.  Please go to [the logs of the integration testing repo](${RUN_URL}) to review. @scverse/anndata"
        gh issue create --repo scverse/${{ inputs.package }} --title "${issue_title}" --body "${ISSUE_BODY}"

    - name: Close resolved failure issue
      if: inputs.status == 'success' && github.event_name == 'schedule'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        for FAILURE_TYPE in install test; do
          ISSUE_TITLE="Integration Testing CI ${FAILURE_TYPE^} Failure on python ${{ inputs.python }}${{ inputs.is-pre == 'true' && ' with prerelease dependencies' || '' }}"
          ISSUE=$(gh issue list --repo scverse/${{ inputs.package }} --state open --search "${ISSUE_TITLE}" --json number,title | jq --arg title "$ISSUE_TITLE" '[.[] | select(.title == $title)] | .[0] // empty')
          if [[ -n "$ISSUE" ]]; then
            ISSUE_NUMBER=$(echo "$ISSUE" | jq -r '.number')
            echo "Tests passing — closing issue #$ISSUE_NUMBER: $ISSUE_TITLE"
            # https://github.com/cli/cli/issues/8374 got graphql error about comment, could be a bug.
            # TODO: Add a comment for the closed issue.
            gh issue close "$ISSUE_NUMBER" --repo scverse/${{ inputs.package }} --comment "Closing issue as tests are now passing."
          fi
        done
